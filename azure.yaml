# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: hydrafusion-demos
metadata:
  template: hydrafusion-demos@1.0.0

services:
  web:
    project: .
    language: js
    host: containerapp
    docker:
      path: ./Dockerfile
      remoteBuild: true

hooks:
  # Takes a GitHub token from the GitHub CLI and makes the live-run access key.
  preprovision:
    windows:
      shell: pwsh
      run: node infra/hooks/preprovision.mjs
    posix:
      shell: sh
      run: node infra/hooks/preprovision.mjs
  # Prints the dashboard link, with the access key for live runs.
  postdeploy:
    windows:
      shell: pwsh
      run: node infra/hooks/postdeploy.mjs
    posix:
      shell: sh
      run: node infra/hooks/postdeploy.mjs
